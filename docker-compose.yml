# GridPulse EMS — full production-shaped stack.
# This file is for a machine WITH Docker. The offline demo (README §2) does
# not need it. Do not run this on a laptop and expect the demo to need it.
#
# Stack mapping (one service per layer from the tech-stack deep dive):
#   field/edge  : modbus-stub + node-red (protocol translation)
#   transport   : emqx (MQTT / UNS) -> kafka (durable event log, KRaft, no ZooKeeper)
#   storage     : timescaledb (PostgreSQL + Timescale), influxdb (telemetry mirror)
#   platform    : api (FastAPI), ingestion worker (gridpulse.ingestion)
#   apps        : grafana, prometheus (EMS observability)
#   safety      : BESS safety stays in edge.py / battery controller — never in the cloud.
services:
  emqx:
    image: emqx/emqx:5.8
    ports: ["1883:1883", "18083:18083"]
    environment: [EMQX_DASHBOARD__DEFAULT_USERNAME=admin, EMQX_DASHBOARD__DEFAULT_PASSWORD=gridpulse]
    volumes: [emqx-data:/opt/emqx/data]
  kafka:
    image: apache/kafka:3.9
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    volumes: [kafka-data:/var/lib/kafka/data]
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    ports: ["5432:5432"]
    environment: [POSTGRES_USER=gridpulse, POSTGRES_PASSWORD=gridpulse, POSTGRES_DB=gridpulse]
    volumes: [ts-data:/var/lib/postgresql/data, ./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro]
  influxdb:
    image: influxdb:2.7
    ports: ["8086:8086"]
    environment: [DOCKER_INFLUXDB_INIT_MODE=setup, DOCKER_INFLUXDB_INIT_USERNAME=gridpulse,
      DOCKER_INFLUXDB_INIT_PASSWORD=gridpulse123, DOCKER_INFLUXDB_INIT_ORG=gridpulse,
      DOCKER_INFLUXDB_INIT_BUCKET=ems]
    volumes: [influx-data:/var/lib/influxdb2]
  node-red:
    image: nodered/node-red:4
    ports: ["1880:1880"]
    volumes: [nodered-data:/data]
  grafana:
    # Grafana publishes full x.y.z tags (e.g. 11.4.3); the bare tag "11"
    # does not resolve on Docker Hub and fails with "not found".
    image: grafana/grafana:11.4.3
    ports: ["3000:3000"]
    environment: [GF_SECURITY_ADMIN_USER=admin, GF_SECURITY_ADMIN_PASSWORD=gridpulse]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [timescaledb, influxdb]
  prometheus:
    image: prom/prometheus:v3
    ports: ["9090:9090"]
    volumes: [./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
  api:
    build: .
    command: uvicorn gridpulse.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment: [PYTHONPATH=/app/src]
    depends_on: [timescaledb, emqx, kafka]
volumes:
  emqx-data: {}
  kafka-data: {}
  ts-data: {}
  influx-data: {}
  nodered-data: {}
